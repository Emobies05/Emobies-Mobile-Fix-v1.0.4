name: emobies
version: 2.0.1+212
publish_to: none
description: Emobies Mobile Repair Platform - Flutter

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  lottie: ^3.1.2
  
  # State Management
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  equatable: ^2.0.5
  
  # Backend
  supabase_flutter: ^2.5.8
  
  # HTTP & APIs
  http: ^1.2.1
  dio: ^5.5.0
  retrofit: ^4.1.0
  
  # Auth & Security
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  
  # Location
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0
  flutter_polyline_points: ^2.1.0
  
  # Image
  image_picker: ^1.1.2
  image_cropper: ^7.0.5
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  
  # Notifications
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1
  
  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utils
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  
  # Web3
  web3dart: ^2.7.3
  bip39: ^1.0.6
  ed25519_hd_key: ^2.3.0
  
  # Chat
  socket_io_client: ^3.0.0
  
  # Date/Time
  intl: ^0.19.0
  timeago: ^3.7.0

  # Animation
  animate_do: ^3.3.4
  
  # File
  path_provider: ^2.1.3
  file_picker: ^8.0.6

dependency_overrides:
  path_provider_foundation: 2.3.2
  
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
